<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitches by S - Income & Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-cut"></i>
                <h1>Stitches by <span class="gradient-text">S</span></h1>
            </div>
            <p class="subtitle">Professional Income & Expense Tracker for Tailoring Business</p>
        </header>

        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="card income">
                <div class="card-icon"><i class="fas fa-arrow-up"></i></div>
                <div class="card-content">
                    <h3>Total Income</h3>
                    <p id="totalIncome">₹0.00</p>
                </div>
            </div>
            <div class="card expense">
                <div class="card-icon"><i class="fas fa-arrow-down"></i></div>
                <div class="card-content">
                    <h3>Total Expenses</h3>
                    <p id="totalExpenses">₹0.00</p>
                </div>
            </div>
            <div class="card balance">
                <div class="card-icon"><i class="fas fa-wallet"></i></div>
                <div class="card-content">
                    <h3>Net Balance</h3>
                    <p id="netBalance">₹0.00</p>
                </div>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="form-container">
            <h2><i class="fas fa-plus-circle"></i> Add Transaction</h2>
            <form id="transactionForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Type</label>
                        <select id="type" required>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amount (₹)</label>
                        <input type="number" id="amount" placeholder="0.00" step="0.01" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <optgroup label="Income Categories">
                                <option value="Tailoring Work">Tailoring Work</option>
                                <option value="Alterations">Alterations</option>
                            </optgroup>
                            <optgroup label="Expense Categories">
                                <option value="Accessories Purchase">Accessories Purchase</option>
                                <option value="Thread & Needles">Thread & Needles</option>
                                <option value="Equipment">Equipment</option>
                                <option value="Other">Other</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description / Customer Details</label>
                    <input type="text" id="description" placeholder="e.g., B202 Mythili, Cash paid" required>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-plus"></i> Add Transaction
                </button>
            </form>
        </div>

        <!-- Filter & Search -->
        <div class="filter-container">
            <input type="text" id="searchInput" placeholder="🔍 Search transactions...">
            <select id="filterMonth">
                <option value="all">All Time</option>
                <option value="current">Current Month</option>
                <option value="last">Last Month</option>
            </select>
            <button id="pdfReportBtn" class="btn-pdf">
                <i class="fas fa-file-pdf"></i> PDF Report
            </button>
        </div>

        <!-- Transactions List -->
        <div class="transactions-container">
            <h2><i class="fas fa-list"></i> Recent Transactions</h2>
            <div id="transactionsList" class="transaction-list">
                <!-- Transactions will be loaded here -->
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="clearBtn" class="btn-action clear-all">
                <i class="fas fa-trash-alt"></i> Clear All
            </button>
            <button id="exportBtn" class="btn-action export">
                <i class="fas fa-download"></i> Export Data
            </button>
        </div>

        <!-- Sync Status -->
        <div class="sync-status" id="syncStatus">
            <i class="fas fa-cloud"></i> <span id="syncText">Connecting to Firestore...</span>
        </div>

        <!-- Footer -->
        <footer class="app-footer">
            Powered by iniyan.talkies
        </footer>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
