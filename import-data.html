        async function importData() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<div class="status info">🔄 Importing 35 transactions...</div>';
            
            try {
                const userEmail = 'callpavithra52@gmail.com';
                let successCount = 0;
                
                for (const transaction of transactionsData) {
                    const doc = {
                        userEmail: userEmail,
                        type: transaction.type,
                        amount: transaction.amount,
                        category: transaction.category,
                        date: transaction.date,
                        description: transaction.description,
                        createdAt: new Date().toISOString()
                    };
                    
                    await db.collection('transactions').add(doc);
                    successCount++;
                }
                
                statusDiv.innerHTML = `
                    <div class="status success">
                        ✅ Successfully imported ${successCount} transactions!<br>
                        Total Income: ₹17,650.00<br>
                        Total Expenses: ₹4,052.00<br>
                        Net Balance: ₹13,598.00<br><br>
                        <a href="index.html" style="color: #155724; font-weight: bold;">Go to App →</a>
                    </div>
                `;
                
            } catch (error) {
                console.error('Import error:', error);
                statusDiv.innerHTML = `
                    <div class="status error">
                        ❌ Error importing data: ${error.message}<br>
                        Please check your Firebase configuration and try again.
                    </div>
                `;
            }
        }

        async function clearExisting() {
            if (!confirm('⚠️ This will delete ALL existing transactions. Continue?')) return;
            
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<div class="status info">🗑️ Clearing existing data...</div>';
            
            try {
                const snapshot = await db.collection('transactions').get();
                const batch = db.batch();
                snapshot.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                
                statusDiv.innerHTML = '<div class="status success">✅ All existing data cleared. Now click "Import All Transactions"</div>';
            } catch (error) {
                statusDiv.innerHTML = `<div class="status error">❌ Error: ${error.message}</div>`;
            }
        }
