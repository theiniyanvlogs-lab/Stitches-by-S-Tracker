        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        function showStatus(type, message) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.innerHTML = message;
        }

        async function importAllTransactions() {
            console.log('🔘 Import button clicked');
            
            if (typeof db === 'undefined') {
                console.error('❌ Firebase db not available');
                showStatus('error', '❌ Firebase is not initialized. Check console for details.');
                return;
            }

            console.log(`📊 Total transactions to import: ${transactionsData.length}`);
            
            const importBtn = document.getElementById('importBtn');
            importBtn.disabled = true;
            importBtn.textContent = '⏳ Importing...';
            
            showStatus('info', '🔄 Importing 35 transactions to Firestore...');
            console.log('🔄 Starting import process...');
            
            try {
                const userEmail = 'callpavithra52@gmail.com';
                let successCount = 0;
                let errorCount = 0;
                
                for (let i = 0; i < transactionsData.length; i++) {
                    const transaction = transactionsData[i];
                    
                    try {
                        console.log(`📝 Importing ${i + 1}/${transactionsData.length}: ${transaction.category} - ₹${transaction.amount}`);
                        
                        const doc = {
                            userEmail: userEmail,
                            type: transaction.type,
                            amount: transaction.amount,
                            category: transaction.category,
                            date: transaction.date,
                            description: transaction.description,
                            createdAt: new Date().toISOString()
                        };
                        
                        await db.collection('transactions').add(doc);
                        successCount++;
                        
                    } catch (err) {
                        errorCount++;
                        console.error(`❌ Error importing transaction ${i + 1}:`, err);
                    }
                }
                
                const incomeTotal = transactionsData.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
                const expenseTotal = transactionsData.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
                
                console.log(`✅ Import complete! Success: ${successCount}, Errors: ${errorCount}`);
                
                showStatus('success', `
                    <strong>✅ Import Complete!</strong><br>
                    Successfully imported: ${successCount} transactions<br>
                    Errors: ${errorCount}<br><br>
                    <div style="background: white; margin: 10px 0; padding: 10px; border-radius: 5px;">
                        <strong>📊 Summary:</strong><br>
                        Total Income: ₹${incomeTotal.toFixed(2)}<br>
                        Total Expenses: ₹${expenseTotal.toFixed(2)}<br>
                        Net Balance: ₹${(incomeTotal - expenseTotal).toFixed(2)}
                    </div>
                    <a href="index.html" style="color: #155724; font-weight: bold; font-size: 1.1rem;">
                        Go to Main App →
                    </a>
                `);
                
            } catch (error) {
                console.error('❌ Critical error:', error);
                showStatus('error', `❌ Error importing data: ${error.message}`);
            } finally {
                const importBtn = document.getElementById('importBtn');
                importBtn.disabled = false;
                importBtn.textContent = '📥 Import All Transactions';
            }
        }

        async function clearExistingData() {
            if (!confirm('⚠️ This will delete ALL existing transactions for callpavithra52@gmail.com. Continue?')) {
                return;
            }
            
            if (typeof db === 'undefined') {
                showStatus('error', '❌ Firebase is not initialized.');
                return;
            }
            
            const clearBtn = document.getElementById('clearBtn');
            clearBtn.disabled = true;
            clearBtn.textContent = '⏳ Clearing...';
            
            showStatus('info', '🗑️ Clearing existing data...');
            console.log('🗑️ Starting to clear existing data...');
            
            try {
                const userEmail = 'callpavithra52@gmail.com';
                const snapshot = await db.collection('transactions')
                    .where('userEmail', '==', userEmail)
                    .get();
                
                const batch = db.batch();
                snapshot.forEach(doc => {
                    batch.delete(doc.ref);
                });
                
                await batch.commit();
                
                console.log(`✅ Cleared ${snapshot.size} transactions`);
                showStatus('success', `
                    ✅ Cleared ${snapshot.size} existing transactions.<br>
                    Now click <strong>"Import All Transactions"</strong> to import the PDF data.
                `);
                
            } catch (error) {
                console.error('❌ Error clearing data:', error);
                showStatus('error', `❌ Error clearing data: ${error.message}`);
            } finally {
                const clearBtn = document.getElementById('clearBtn');
                clearBtn.disabled = false;
                clearBtn.textContent = '🗑️ Clear Existing Data First';
            }
        }

        // Initial check
        window.addEventListener('load', () => {
            console.log('📄 Page loaded');
            if (typeof db !== 'undefined') {
                console.log('✅ Firebase is connected');
                showStatus('info', '✅ Firebase connected. Ready to import 35 transactions.');
            } else {
                console.error('❌ Firebase not connected');
                showStatus('error', '❌ Firebase not connected. Please check firebase-config.js');
            }
